[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chessmind-ai"
version = "0.1.0"
description = "ChessMind AI - Intelligent Chess Move Predictor & Core Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "chess>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
